
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SETTINGS
const ROTATION_SPEED = 0.001;
const MODEL_SIZE = 2.0;
const CAMERA_MARGIN = 1.5;

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// ENVIRONMENT
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment();

scene.environment = pmremGenerator.fromScene(environment).texture;

environment.dispose();
pmremGenerator.dispose();

// LIGHTING
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);

dirLight.position.set(2, 6, 3);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);

scene.add(dirLight);

// MATERIAL
const metallicMaterial = new THREE.MeshStandardMaterial({
  color: 0xd8dde6,
  metalness: 0.96,
  roughness: 0.14
});

// ROTATING GROUP
const spinGroup = new THREE.Group();
scene.add(spinGroup);

// LOAD MODEL
const loader = new GLTFLoader();

loader.load(
  './Spoon.glb',

  (gltf) => {
    const model = gltf.scene;

    model.traverse((child) => {
      if (child.isMesh) {
        child.material = metallicMaterial;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // Find original dimensions
    const originalBox = new THREE.Box3().setFromObject(model);
    const originalSize = originalBox.getSize(new THREE.Vector3());

    const maxDim = Math.max(
      originalSize.x,
      originalSize.y,
      originalSize.z
    );

    if (!Number.isFinite(maxDim) || maxDim <= 0) {
      console.error('Invalid model dimensions');
      return;
    }

    // Scale model
    model.scale.multiplyScalar(MODEL_SIZE / maxDim);

    // Centre model
    const scaledBox = new THREE.Box3().setFromObject(model);
    const center = scaledBox.getCenter(new THREE.Vector3());

    model.position.sub(center);

    // Add model to rotating group
    spinGroup.add(model);

    // Calculate actual model dimensions
    const finalBox = new THREE.Box3().setFromObject(spinGroup);
    const finalSize = finalBox.getSize(new THREE.Vector3());

    // Calculate camera distance to fit model
    const verticalFov = THREE.MathUtils.degToRad(camera.fov);
    const horizontalFov = 2 * Math.atan(
      Math.tan(verticalFov / 2) * camera.aspect
    );

    const verticalDistance =
      finalSize.y / (2 * Math.tan(verticalFov / 2));

    const horizontalDistance =
      finalSize.x / (2 * Math.tan(horizontalFov / 2));

    const distance = Math.max(
      verticalDistance,
      horizontalDistance,
      finalSize.z / 2
    ) * CAMERA_MARGIN;

    // Position camera
    camera.position.set(0, 0, distance);
    camera.lookAt(0, 0, 0);

    camera.near = Math.max(0.001, distance / 100);
    camera.far = distance * 100;
    camera.updateProjectionMatrix();

    console.log('Spoon loaded!');
    console.log('Model size:', finalSize);
    console.log('Camera distance:', distance);
  },

  undefined,

  (error) => {
    console.error('Could not load Spoon.glb:', error);
  }
);

// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  spinGroup.rotation.y += ROTATION_SPEED;

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
