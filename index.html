
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoon</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  canvas {
    display: block;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// SETTINGS
const MODEL_SIZE = 3.5;
const CAMERA_DISTANCE = 8;

const DEFAULT_X = -90;
const DEFAULT_Y = -90;
const DEFAULT_Z = 90;

// RANDOM SPIN SETTINGS
const MIN_SPEED = 0.8;
const MAX_SPEED = 2.5;
const MIN_CHANGE_TIME = 0.8;
const MAX_CHANGE_TIME = 2.2;
const DIRECTION_SMOOTHNESS = 2.5;

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, CAMERA_DISTANCE);
camera.lookAt(0, 0, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// REFLECTIONS
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment();

scene.environment = pmremGenerator.fromScene(environment).texture;

environment.dispose();
pmremGenerator.dispose();

// LIGHTING
const mainLight = new THREE.DirectionalLight(0xffffff, 4);
mainLight.position.set(4, 6, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x9bbcff, 2);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 3);
rimLight.position.set(0, 4, -5);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// SPIN GROUP
const spinGroup = new THREE.Group();
scene.add(spinGroup);

// ORIENTATION GROUP
const orientationGroup = new THREE.Group();

orientationGroup.rotation.set(
  THREE.MathUtils.degToRad(DEFAULT_X),
  THREE.MathUtils.degToRad(DEFAULT_Y),
  THREE.MathUtils.degToRad(DEFAULT_Z)
);

spinGroup.add(orientationGroup);

// RANDOM SPIN
const currentSpeed = new THREE.Vector3(0, 0, 0);
const targetSpeed = new THREE.Vector3(0, 0, 0);

let changeTimer = 0;

function randomSignedSpeed() {
  const direction = Math.random() < 0.5 ? -1 : 1;
  const speed = THREE.MathUtils.randFloat(MIN_SPEED, MAX_SPEED);

  return direction * speed;
}

function chooseRandomDirection() {
  // Each axis gets its own random direction.
  targetSpeed.set(
    randomSignedSpeed(),
    randomSignedSpeed(),
    randomSignedSpeed()
  );

  changeTimer = THREE.MathUtils.randFloat(
    MIN_CHANGE_TIME,
    MAX_CHANGE_TIME
  );
}

// Start with a random direction.
chooseRandomDirection();

// LOAD SPOON
const loader = new GLTFLoader();

loader.load(
  "./spoon.glb",

  (gltf) => {
    const model = gltf.scene;

    const silverMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8dde6,
      metalness: 0.96,
      roughness: 0.14,
      side: THREE.DoubleSide
    });

    model.traverse((child) => {
      if (child.isMesh) {
        child.material = silverMaterial;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // CENTRE MODEL
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    model.position.sub(center);

    // SCALE
    const maxDimension = Math.max(size.x, size.y, size.z);
    model.scale.setScalar(MODEL_SIZE / maxDimension);

    orientationGroup.add(model);

    console.log("Spoon loaded!");
  },

  undefined,

  (error) => {
    console.error("Could not load spoon.glb:", error);
  }
);

// ANIMATION
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  // Pick new random directions periodically.
  changeTimer -= delta;

  if (changeTimer <= 0) {
    chooseRandomDirection();
  }

  // Smoothly accelerate, slow down and reverse.
  const blend = 1 - Math.exp(-DIRECTION_SMOOTHNESS * delta);

  currentSpeed.lerp(targetSpeed, blend);

  // Apply independent rotation on all three axes.
  spinGroup.rotation.x += currentSpeed.x * delta;
  spinGroup.rotation.y += currentSpeed.y * delta;
  spinGroup.rotation.z += currentSpeed.z * delta;

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
