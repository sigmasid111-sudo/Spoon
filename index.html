
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
    }
  </style>

  <!-- Fixed Three.js imports -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// 1. Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// 2. Camera
const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.4, 4.8);
camera.lookAt(0, -0.1, 0);

// 3. Renderer
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// 4. Environment reflections
const pmremGenerator = new THREE.PMREMGenerator(renderer);

const environment = new RoomEnvironment();
scene.environment = pmremGenerator.fromScene(environment).texture;

environment.dispose();
pmremGenerator.dispose();

// 5. Lighting
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);

dirLight.position.set(2, 6, 3);
dirLight.castShadow = true;

dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -5;
dirLight.shadow.camera.right = 5;
dirLight.shadow.camera.top = 5;
dirLight.shadow.camera.bottom = -5;
dirLight.shadow.bias = -0.0001;

scene.add(dirLight);

// 6. Shadow floor
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(15, 15),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);

shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = -1.15;
shadowFloor.receiveShadow = true;

scene.add(shadowFloor);

// 7. Metallic material
const metallicMaterial = new THREE.MeshStandardMaterial({
  color: 0xd8dde6,
  metalness: 0.96,
  roughness: 0.14
});

// 8. Spoon group
const spinGroup = new THREE.Group();
scene.add(spinGroup);

// 9. Load model
const loader = new GLTFLoader();

loader.load(
  './Spoon.glb',

  (gltf) => {
    const model = gltf.scene;

    model.traverse((child) => {
      if (child.isMesh) {
        child.material = metallicMaterial;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // Calculate original dimensions
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());

    const maxDim = Math.max(size.x, size.y, size.z);

    if (maxDim === 0) {
      console.error('Spoon model has invalid dimensions.');
      return;
    }

    // Scale model
    const scaleFactor = 2.8 / maxDim;
    model.scale.setScalar(scaleFactor);

    // Centre model
    const scaledBox = new THREE.Box3().setFromObject(model);
    const center = scaledBox.getCenter(new THREE.Vector3());

    model.position.set(-center.x, -center.y, -center.z);

    // Slight tilt
    // Correct spoon orientation
    model.rotation.set(Math.PI / 2, 0, Math.PI / 2);

    spinGroup.add(model);

    console.log('Spoon loaded successfully!');
  },

  (progress) => {
    if (progress.total > 0) {
      console.log(
        'Loading spoon:',
        Math.round(progress.loaded / progress.total * 100) + '%'
      );
    }
  },

  (error) => {
    console.error('Error loading Spoon.glb:', error);
  }
);

// 10. Animation
function animate() {
  requestAnimationFrame(animate);

  spinGroup.rotation.y += 0.001;

  renderer.render(scene, camera);
}

animate();

// 11. Window resizing
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
