
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoon</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  canvas {
    display: block;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// SETTINGS
const MODEL_SIZE = 3.5;
const CAMERA_DISTANCE = 8;

const DEFAULT_X = -90;
const DEFAULT_Y = -90;
const DEFAULT_Z = 90;

// RANDOM MOVEMENT SETTINGS
const MIN_SPEED = 0.3;
const MAX_SPEED = 1.5;
const MIN_TURN_TIME = 1.5;
const MAX_TURN_TIME = 4;

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, CAMERA_DISTANCE);
camera.lookAt(0, 0, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// REFLECTION ENVIRONMENT
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment();

scene.environment = pmremGenerator.fromScene(environment).texture;

environment.dispose();
pmremGenerator.dispose();

// LIGHTING
const mainLight = new THREE.DirectionalLight(0xffffff, 4);
mainLight.position.set(4, 6, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x9bbcff, 2);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 3);
rimLight.position.set(0, 4, -5);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// SPIN GROUP
const spinGroup = new THREE.Group();
scene.add(spinGroup);

// ORIENTATION GROUP
const orientationGroup = new THREE.Group();

orientationGroup.rotation.set(
  THREE.MathUtils.degToRad(DEFAULT_X),
  THREE.MathUtils.degToRad(DEFAULT_Y),
  THREE.MathUtils.degToRad(DEFAULT_Z)
);

spinGroup.add(orientationGroup);

// RANDOM ROTATION TARGETS
let targetRotation = new THREE.Euler();
let targetSpeed = new THREE.Vector3();
let nextChange = 0;

function chooseRandomMovement() {
  targetRotation.set(
    THREE.MathUtils.degToRad(DEFAULT_X + THREE.MathUtils.randFloat(-180, 180)),
    THREE.MathUtils.degToRad(DEFAULT_Y + THREE.MathUtils.randFloat(-180, 180)),
    THREE.MathUtils.degToRad(DEFAULT_Z + THREE.MathUtils.randFloat(-180, 180))
  );

  targetSpeed.set(
    THREE.MathUtils.randFloat(-MAX_SPEED, MAX_SPEED),
    THREE.MathUtils.randFloat(-MAX_SPEED, MAX_SPEED),
    THREE.MathUtils.randFloat(-MAX_SPEED, MAX_SPEED)
  );

  nextChange = THREE.MathUtils.randFloat(
    MIN_TURN_TIME,
    MAX_TURN_TIME
  );
}

chooseRandomMovement();

// LOAD SPOON
const loader = new GLTFLoader();

loader.load(
  "./spoon.glb",

  (gltf) => {
    const model = gltf.scene;

    const silverMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8dde6,
      metalness: 0.96,
      roughness: 0.14,
      side: THREE.DoubleSide
    });

    model.traverse((child) => {
      if (child.isMesh) {
        child.material = silverMaterial;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // CENTRE MODEL
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    model.position.sub(center);

    // SCALE MODEL
    const maxDimension = Math.max(size.x, size.y, size.z);
    model.scale.setScalar(MODEL_SIZE / maxDimension);

    orientationGroup.add(model);

    console.log("Spoon loaded!");
  },

  undefined,

  (error) => {
    console.error("Could not load spoon.glb:", error);
  }
);

// ANIMATION
const clock = new THREE.Clock();

const currentRotation = new THREE.Euler(
  THREE.MathUtils.degToRad(DEFAULT_X),
  THREE.MathUtils.degToRad(DEFAULT_Y),
  THREE.MathUtils.degToRad(DEFAULT_Z)
);

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  // Occasionally choose a completely new movement.
  nextChange -= delta;

  if (nextChange <= 0) {
    chooseRandomMovement();
  }

  // Smoothly change rotation.
  currentRotation.x += targetSpeed.x * delta;
  currentRotation.y += targetSpeed.y * delta;
  currentRotation.z += targetSpeed.z * delta;

  // Apply random rotation to the spoon.
  orientationGroup.rotation.copy(currentRotation);

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
