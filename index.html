
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoon</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  canvas {
    display: block;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// SETTINGS
const ROTATION_SPEED = 0.01;
const MODEL_SIZE = 3.5;
const CAMERA_DISTANCE = 8;

// STARTING ROTATION
const SPOON_ROTATION_X = -90;
const SPOON_ROTATION_Y = -90;
const SPOON_ROTATION_Z = 90;

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, CAMERA_DISTANCE);
camera.lookAt(0, 0, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// REFLECTION ENVIRONMENT
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment();

scene.environment = pmremGenerator.fromScene(environment).texture;

environment.dispose();
pmremGenerator.dispose();

// LIGHTING
const mainLight = new THREE.DirectionalLight(0xffffff, 4);
mainLight.position.set(4, 6, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x9bbcff, 2);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 3);
rimLight.position.set(0, 4, -5);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// SPIN GROUP
const spinGroup = new THREE.Group();
scene.add(spinGroup);

// ORIENTATION GROUP
const orientationGroup = new THREE.Group();

orientationGroup.rotation.set(
  THREE.MathUtils.degToRad(SPOON_ROTATION_X),
  THREE.MathUtils.degToRad(SPOON_ROTATION_Y),
  THREE.MathUtils.degToRad(SPOON_ROTATION_Z)
);

spinGroup.add(orientationGroup);

// LOAD SPOON
const loader = new GLTFLoader();

loader.load(
  "./spoon.glb",

  (gltf) => {
    const model = gltf.scene;

    // SILVER MATERIAL
    const silverMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8dde6,
      metalness: 0.96,
      roughness: 0.14,
      side: THREE.DoubleSide
    });

    model.traverse((child) => {
      if (child.isMesh) {
        child.material = silverMaterial;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // CREATE CENTRED HOLDER
    const modelHolder = new THREE.Group();
    modelHolder.add(model);

    // MEASURE MODEL BEFORE ROTATION
    model.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    // CENTRE MODEL AT ORIGIN
    model.position.sub(center);

    // SCALE MODEL
    const maxDimension = Math.max(size.x, size.y, size.z);
    modelHolder.scale.setScalar(MODEL_SIZE / maxDimension);

    // ADD MODEL
    orientationGroup.add(modelHolder);

    console.log("Spoon loaded!");
    console.log("Starting rotation: -90, -90, 90");
    console.log("Spinning around Z axis");
  },

  undefined,

  (error) => {
    console.error("Could not load spoon.glb:", error);
  }
);

// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  // SPIN AROUND Z AXIS
  spinGroup.rotation.z += ROTATION_SPEED;

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
