
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #cameraControl {
      position: fixed;
      right: 20px;
      bottom: 20px;
      color: white;
      background: #222;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      font-size: 14px;
    }

    #cameraStatus {
      position: fixed;
      right: 20px;
      bottom: 65px;
      color: #aaa;
      font-size: 12px;
      z-index: 10;
    }

    #cameraToggle {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="cameraStatus">Normal reflections</div>

  <label id="cameraControl">
    <input type="checkbox" id="cameraToggle">
    Camera reflection
  </label>

  <video id="cameraVideo" autoplay playsinline muted
    style="display:none"></video>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    // SCENE
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    // CAMERA
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 10);

    // RENDERER
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);

    // NORMAL ENVIRONMENT REFLECTIONS
    const pmrem = new THREE.PMREMGenerator(renderer);
    const environment = new RoomEnvironment();
    const envTexture = pmrem.fromScene(environment).texture;

    scene.environment = envTexture;

    // LIGHTING
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const keyLight = new THREE.DirectionalLight(0xffffff, 4);
    keyLight.position.set(5, 8, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb8d8ff, 2);
    fillLight.position.set(-6, 2, 4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 4);
    rimLight.position.set(0, -5, -6);
    scene.add(rimLight);

    const pointLight1 = new THREE.PointLight(0xffffff, 80);
    pointLight1.position.set(-4, 3, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x8ebfff, 50);
    pointLight2.position.set(4, -2, 3);
    scene.add(pointLight2);

    // CAMERA TEXTURE PLACEHOLDER
    const placeholderTexture = new THREE.DataTexture(
      new Uint8Array([0, 0, 0, 255]),
      1,
      1,
      THREE.RGBAFormat
    );

    placeholderTexture.needsUpdate = true;

    let cameraTexture = placeholderTexture;
    let cameraStream = null;
    let compiledShader = null;
    let cameraEnabled = false;

    // SILVER MATERIAL
    const spoonMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 1,
      roughness: 0.12,
      envMapIntensity: 2,
      clearcoat: 1,
      clearcoatRoughness: 0.08
    });

    // LIVE CAMERA FEED SHADER
    spoonMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uCameraFeed = {
        value: cameraTexture
      };

      shader.uniforms.uCameraEnabled = {
        value: cameraEnabled ? 1.0 : 0.0
      };

      shader.uniforms.uViewport = {
        value: new THREE.Vector2(
          window.innerWidth,
          window.innerHeight
        )
      };

      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <common>",
        `#include <common>
        uniform sampler2D uCameraFeed;
        uniform float uCameraEnabled;
        uniform vec2 uViewport;`
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <opaque_fragment>",
        `#include <opaque_fragment>

        vec2 cameraUV = gl_FragCoord.xy / uViewport;
        cameraUV.y = 1.0 - cameraUV.y;

        vec3 cameraColor = texture2D(
          uCameraFeed,
          cameraUV
        ).rgb;

        gl_FragColor.rgb = mix(
          gl_FragColor.rgb,
          cameraColor,
          uCameraEnabled * 0.85
        );`
      );

      compiledShader = shader;
    };

    // MODEL HOLDER
    const holder = new THREE.Group();
    scene.add(holder);

    // STARTING ROTATION
    holder.rotation.set(
      THREE.MathUtils.degToRad(-90),
      THREE.MathUtils.degToRad(-90),
      THREE.MathUtils.degToRad(90)
    );

    // LOAD SPOON
    const loader = new GLTFLoader();

    loader.load(
      "./spoon.glb",
      (gltf) => {
        const model = gltf.scene;

        model.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(model);
        const centre = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(centre);

        const largestDimension = Math.max(
          size.x,
          size.y,
          size.z
        );

        if (largestDimension > 0) {
          model.scale.setScalar(4 / largestDimension);
        }

        model.traverse((child) => {
          if (child.isMesh) {
            child.material = spoonMaterial;
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        holder.add(model);
      },
      undefined,
      (error) => {
        console.error("Could not load spoon.glb:", error);
      }
    );

    // CAMERA TOGGLE
    const toggle = document.getElementById("cameraToggle");
    const status = document.getElementById("cameraStatus");
    const video = document.getElementById("cameraVideo");

    async function enableCamera() {
      try {
        status.textContent = "Requesting camera permission...";

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        cameraTexture = new THREE.VideoTexture(video);
        cameraTexture.colorSpace = THREE.SRGBColorSpace;
        cameraTexture.minFilter = THREE.LinearFilter;
        cameraTexture.magFilter = THREE.LinearFilter;

        cameraEnabled = true;

        if (compiledShader) {
          compiledShader.uniforms.uCameraFeed.value = cameraTexture;
          compiledShader.uniforms.uCameraEnabled.value = 1.0;
        }

        status.textContent = "Live camera reflection";
      } catch (error) {
        console.error("Camera error:", error);

        cameraEnabled = false;
        toggle.checked = false;

        status.textContent =
          "Camera unavailable - check permissions";
      }
    }

    function disableCamera() {
      cameraEnabled = false;

      if (compiledShader) {
        compiledShader.uniforms.uCameraEnabled.value = 0.0;
        compiledShader.uniforms.uCameraFeed.value = placeholderTexture;
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      if (cameraTexture !== placeholderTexture) {
        cameraTexture.dispose();
        cameraTexture = placeholderTexture;
      }

      video.srcObject = null;
      status.textContent = "Normal reflections";
    }

    toggle.addEventListener("change", () => {
      if (toggle.checked) {
        enableCamera();
      } else {
        disableCamera();
      }
    });

    // DRAG ROTATION AND PINCH ZOOM
    const pointers = new Map();

    let previousPinchDistance = null;
    let velocityX = 0;
    let velocityY = 0;
    let dragging = false;

    function getPinchDistance() {
      const points = [...pointers.values()];

      if (points.length < 2) return null;

      return Math.hypot(
        points[0].x - points[1].x,
        points[0].y - points[1].y
      );
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      renderer.domElement.setPointerCapture(event.pointerId);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      dragging = true;
      velocityX = 0;
      velocityY = 0;

      if (pointers.size === 2) {
        previousPinchDistance = getPinchDistance();
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!pointers.has(event.pointerId)) return;

      const previous = pointers.get(event.pointerId);

      const dx = event.clientX - previous.x;
      const dy = event.clientY - previous.y;

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 1) {
        holder.rotation.y += dx * 0.008;
        holder.rotation.x += dy * 0.008;

        velocityX = dx * 0.008;
        velocityY = dy * 0.008;
      }

      if (pointers.size === 2) {
        const distance = getPinchDistance();

        if (distance !== null && previousPinchDistance !== null) {
          const change = distance - previousPinchDistance;

          camera.position.z -= change * 0.015;
          camera.position.z = THREE.MathUtils.clamp(
            camera.position.z,
            3,
            25
          );
        }

        previousPinchDistance = distance;
      }
    });

    function endPointer(event) {
      pointers.delete(event.pointerId);

      if (pointers.size < 2) {
        previousPinchDistance = null;
      }

      if (pointers.size === 0) {
        dragging = false;
      }
    }

    renderer.domElement.addEventListener("pointerup", endPointer);
    renderer.domElement.addEventListener("pointercancel", endPointer);

    // MOUSE WHEEL ZOOM
    renderer.domElement.addEventListener("wheel", (event) => {
      camera.position.z += event.deltaY * 0.008;

      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z,
        3,
        25
      );
    }, { passive: true });

    // RESIZE
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      if (compiledShader) {
        compiledShader.uniforms.uViewport.value.set(
          window.innerWidth,
          window.innerHeight
        );
      }
    });

    // ANIMATION
    function animate() {
      requestAnimationFrame(animate);

      if (!dragging) {
        holder.rotation.y += velocityX;
        holder.rotation.x += velocityY;

        velocityX *= 0.94;
        velocityY *= 0.94;

        if (Math.abs(velocityX) < 0.00001) velocityX = 0;
        if (Math.abs(velocityY) < 0.00001) velocityY = 0;
      }

      renderer.render(scene, camera);
    }

    animate();

  </script>
</body>
</html>
