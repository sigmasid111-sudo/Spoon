
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

// Reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(
  new RoomEnvironment(),
  0.04
).texture;

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1));

const light1 = new THREE.DirectionalLight(0xffffff, 3);
light1.position.set(5, 5, 5);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0xffffff, 2);
light2.position.set(-5, 2, -5);
scene.add(light2);

// Rotation groups
const spinGroup = new THREE.Group();
scene.add(spinGroup);

const orientationGroup = new THREE.Group();
spinGroup.add(orientationGroup);

// Starting rotation:
// X = -90°, Y = -90°, Z = 90°
orientationGroup.rotation.set(
  THREE.MathUtils.degToRad(-90),
  THREE.MathUtils.degToRad(-90),
  THREE.MathUtils.degToRad(90)
);

// Load spoon
const loader = new GLTFLoader();

loader.load(
  "./spoon.glb",
  (gltf) => {
    const model = gltf.scene;

    model.updateMatrixWorld(true);

    // Silver material
    model.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          metalness: 0.96,
          roughness: 0.14
        });
      }
    });

    // Centre and scale model
    const box = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    const maxDimension = Math.max(size.x, size.y, size.z);
    const modelPivot = new THREE.Group();

    model.position.sub(centre);
    modelPivot.add(model);

    modelPivot.scale.setScalar(3.5 / maxDimension);
    orientationGroup.add(modelPivot);
  },
  undefined,
  (error) => {
    console.error("Could not load spoon.glb:", error);
  }
);

// Mouse dragging
let dragging = false;
let previousX = 0;
let previousY = 0;

renderer.domElement.addEventListener("pointerdown", (event) => {
  dragging = true;
  previousX = event.clientX;
  previousY = event.clientY;

  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener("pointermove", (event) => {
  if (!dragging) return;

  const deltaX = event.clientX - previousX;
  const deltaY = event.clientY - previousY;

  spinGroup.rotation.y += deltaX * 0.01;
  spinGroup.rotation.x += deltaY * 0.01;

  previousX = event.clientX;
  previousY = event.clientY;
});

renderer.domElement.addEventListener("pointerup", () => {
  dragging = false;
});

renderer.domElement.addEventListener("pointercancel", () => {
  dragging = false;
});

// Keep still when not dragging
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
