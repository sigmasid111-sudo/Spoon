
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoon</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  #controls {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 260px;
    padding: 18px;
    color: white;
    background: rgba(20, 20, 25, 0.95);
    border: 2px solid #888;
    border-radius: 12px;
    z-index: 9999;
    pointer-events: auto;
  }

  #controls h2 {
    margin: 0 0 18px;
    font-size: 20px;
  }

  .slider {
    margin-bottom: 18px;
  }

  .slider label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: #55aaff;
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    color: white;
    background: #333;
    border: 1px solid #888;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background: #555;
  }

  #toggleControls {
    position: fixed;
    top: 15px;
    right: 15px;
    width: auto;
    padding: 12px 18px;
    z-index: 10000;
    background: #222;
  }

  #controls.hidden {
    display: none;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<!-- ROTATION CONTROLS -->
<div id="controls">
  <h2>Spoon Rotation</h2>

  <div class="slider">
    <label>
      X Rotation
      <span id="xValue">-90°</span>
    </label>
    <input id="rotationX" type="range"
           min="-180" max="180" value="-90">
  </div>

  <div class="slider">
    <label>
      Y Rotation
      <span id="yValue">0°</span>
    </label>
    <input id="rotationY" type="range"
           min="-180" max="180" value="0">
  </div>

  <div class="slider">
    <label>
      Z Rotation
      <span id="zValue">90°</span>
    </label>
    <input id="rotationZ" type="range"
           min="-180" max="180" value="90">
  </div>

  <button id="resetButton">Reset Rotation</button>
</div>

<button id="toggleControls">Hide Controls</button>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// SETTINGS
const ROTATION_SPEED = 0.01;
const MODEL_SIZE = 3.5;
const CAMERA_DISTANCE = 8;

const DEFAULT_X = -90;
const DEFAULT_Y = 0;
const DEFAULT_Z = 90;

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, CAMERA_DISTANCE);
camera.lookAt(0, 0, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// ENVIRONMENT REFLECTIONS
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment();

scene.environment = pmremGenerator.fromScene(environment).texture;

environment.dispose();
pmremGenerator.dispose();

// LIGHTING
const mainLight = new THREE.DirectionalLight(0xffffff, 4);
mainLight.position.set(4, 6, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x9bbcff, 2);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 3);
rimLight.position.set(0, 4, -5);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// SPIN GROUP
const spinGroup = new THREE.Group();
scene.add(spinGroup);

let spoonModel = null;

// SLIDERS
const sliderX = document.getElementById("rotationX");
const sliderY = document.getElementById("rotationY");
const sliderZ = document.getElementById("rotationZ");

function updateRotation() {
  const x = Number(sliderX.value);
  const y = Number(sliderY.value);
  const z = Number(sliderZ.value);

  document.getElementById("xValue").textContent = x + "°";
  document.getElementById("yValue").textContent = y + "°";
  document.getElementById("zValue").textContent = z + "°";

  if (spoonModel) {
    spoonModel.rotation.set(
      THREE.MathUtils.degToRad(x),
      THREE.MathUtils.degToRad(y),
      THREE.MathUtils.degToRad(z)
    );
  }
}

sliderX.addEventListener("input", updateRotation);
sliderY.addEventListener("input", updateRotation);
sliderZ.addEventListener("input", updateRotation);

// RESET
document.getElementById("resetButton").addEventListener("click", () => {
  sliderX.value = DEFAULT_X;
  sliderY.value = DEFAULT_Y;
  sliderZ.value = DEFAULT_Z;
  updateRotation();
});

// SHOW / HIDE
const controls = document.getElementById("controls");
const toggleButton = document.getElementById("toggleControls");

toggleButton.addEventListener("click", () => {
  controls.classList.toggle("hidden");

  toggleButton.textContent =
    controls.classList.contains("hidden")
      ? "Show Controls"
      : "Hide Controls";
});

// INITIAL VALUES
updateRotation();

// LOAD MODEL
const loader = new GLTFLoader();

loader.load(
  "./spoon.glb",

  (gltf) => {
    const model = gltf.scene;

    const silverMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8dde6,
      metalness: 0.96,
      roughness: 0.14,
      side: THREE.DoubleSide
    });

    model.traverse((child) => {
      if (child.isMesh) {
        child.material = silverMaterial;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // APPLY STARTING ROTATION
    model.rotation.set(
      THREE.MathUtils.degToRad(Number(sliderX.value)),
      THREE.MathUtils.degToRad(Number(sliderY.value)),
      THREE.MathUtils.degToRad(Number(sliderZ.value))
    );

    // SCALE
    let box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());

    const maxDimension = Math.max(size.x, size.y, size.z);
    model.scale.setScalar(MODEL_SIZE / maxDimension);

    // CENTRE
    box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    spoonModel = model;
    spinGroup.add(model);

    console.log("Spoon loaded!");
  },

  undefined,

  (error) => {
    console.error("Spoon loading error:", error);
  }
);

// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  spinGroup.rotation.y += ROTATION_SPEED;

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
