
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spoon</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      cursor: grab;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    body:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #settingsButton {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      background: #292929;
      color: white;
      border: 1px solid #555;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    #settingsButton:hover {
      background: #444;
    }

    #settingsPanel {
      position: fixed;
      right: 20px;
      bottom: 75px;
      z-index: 20;
      width: 260px;
      max-height: 75vh;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 15px;
      color: white;
      background: #202020;
      border: 1px solid #444;
      border-radius: 12px;
      display: none;
      cursor: default;
    }

    #settingsPanel.open {
      display: block;
    }

    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panelHeader strong {
      font-size: 16px;
    }

    #closeSettings {
      border: none;
      color: white;
      background: #444;
      border-radius: 5px;
      padding: 5px 9px;
      cursor: pointer;
    }

    .sectionTitle {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-top: 17px;
      margin-bottom: 8px;
    }

    #importButton,
    .actionButton {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      background: #414141;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      border: none;
      font-size: 13px;
      margin-top: 7px;
    }

    #importButton:hover,
    .actionButton:hover {
      background: #555;
    }

    #sceneFile {
      display: none;
    }

    #status {
      color: #aaa;
      font-size: 11px;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    .control {
      margin-top: 12px;
    }

    .controlHeading {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: #ddd;
      font-size: 12px;
    }

    .control input {
      width: 100%;
      cursor: pointer;
      accent-color: white;
    }

    .buttonRow {
      display: flex;
      gap: 7px;
    }

    .buttonRow button {
      flex: 1;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="settingsButton">⚙ Settings</button>

<div id="settingsPanel">
  <div class="panelHeader">
    <strong>Settings</strong>
    <button id="closeSettings">✕</button>
  </div>

  <div class="sectionTitle">Reflection environment</div>

  <label id="importButton" for="sceneFile">
    Import GLB scene
  </label>
  <input id="sceneFile" type="file" accept=".glb">

  <div id="status">Using default reflections</div>

  <div class="sectionTitle">Environment rotation</div>

  <div class="control">
    <div class="controlHeading">
      <span>X rotation</span>
      <span id="rxValue">0°</span>
    </div>
    <input id="rotateX" type="range" min="-180" max="180" value="0">
  </div>

  <div class="control">
    <div class="controlHeading">
      <span>Y rotation</span>
      <span id="ryValue">0°</span>
    </div>
    <input id="rotateY" type="range" min="-180" max="180" value="0">
  </div>

  <div class="control">
    <div class="controlHeading">
      <span>Z rotation</span>
      <span id="rzValue">0°</span>
    </div>
    <input id="rotateZ" type="range" min="-180" max="180" value="0">
  </div>

  <div class="buttonRow">
    <button class="actionButton" id="resetRotation">Reset rotation</button>
  </div>

  <div class="sectionTitle">Environment offset</div>

  <div class="control">
    <div class="controlHeading">
      <span>X offset</span>
      <span id="oxValue">0</span>
    </div>
    <input id="offsetX" type="range" min="-10" max="10" step="0.1" value="0">
  </div>

  <div class="control">
    <div class="controlHeading">
      <span>Y offset</span>
      <span id="oyValue">0</span>
    </div>
    <input id="offsetY" type="range" min="-10" max="10" step="0.1" value="0">
  </div>

  <div class="control">
    <div class="controlHeading">
      <span>Z offset</span>
      <span id="ozValue">0</span>
    </div>
    <input id="offsetZ" type="range" min="-10" max="10" step="0.1" value="0">
  </div>

  <div class="buttonRow">
    <button class="actionButton" id="resetOffset">Reset offset</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// =====================================
// SETTINGS PANEL
// =====================================

const settingsButton = document.getElementById("settingsButton");
const settingsPanel = document.getElementById("settingsPanel");

settingsButton.addEventListener("click", () => {
  settingsPanel.classList.toggle("open");
});

document.getElementById("closeSettings").addEventListener("click", () => {
  settingsPanel.classList.remove("open");
});

// Prevent settings interactions from rotating the spoon
settingsPanel.addEventListener("pointerdown", event => {
  event.stopPropagation();
});

settingsPanel.addEventListener("pointermove", event => {
  event.stopPropagation();
});


// =====================================
// SCENE
// =====================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 10);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// =====================================
// DEFAULT REFLECTIONS
// =====================================

const pmrem = new THREE.PMREMGenerator(renderer);

scene.environment = pmrem.fromScene(
  new RoomEnvironment(),
  0.04
).texture;


// =====================================
// LIGHTING
// =====================================

scene.add(new THREE.AmbientLight(0xffffff, 0.45));

const keyLight = new THREE.DirectionalLight(0xffffff, 4);
keyLight.position.set(4, 7, 6);
keyLight.castShadow = true;

keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.bias = -0.0002;

scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9ecbff, 2.5);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 5);
rimLight.position.set(0, 3, -6);
scene.add(rimLight);

const highlight1 = new THREE.PointLight(0xffffff, 30, 20);
highlight1.position.set(-3, 4, 5);
scene.add(highlight1);

const highlight2 = new THREE.PointLight(0x9ecbff, 20, 20);
highlight2.position.set(4, -2, 3);
scene.add(highlight2);


// =====================================
// SPOON
// =====================================

const rotationGroup = new THREE.Group();
scene.add(rotationGroup);

rotationGroup.rotation.set(
  THREE.MathUtils.degToRad(-90),
  THREE.MathUtils.degToRad(-90),
  THREE.MathUtils.degToRad(90)
);

const spoonMaterial = new THREE.MeshStandardMaterial({
  color: 0xe9edf2,
  metalness: 0.95,
  roughness: 0.12,
  envMapIntensity: 1.8
});

const loader = new GLTFLoader();

loader.load(
  "./spoon.glb",

  (gltf) => {
    const model = gltf.scene;

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        child.material = spoonMaterial;
      }
    });

    model.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    const maxDimension = Math.max(size.x, size.y, size.z);

    if (!Number.isFinite(maxDimension) || maxDimension === 0) {
      console.error("Invalid spoon dimensions");
      return;
    }

    const modelHolder = new THREE.Group();

    modelHolder.add(model);
    model.position.sub(centre);
    modelHolder.scale.setScalar(3.5 / maxDimension);

    rotationGroup.add(modelHolder);

    console.log("Spoon loaded successfully!");
  },

  undefined,

  (error) => {
    console.error("Failed to load spoon.glb:", error);
  }
);


// =====================================
// IMPORTED REFLECTION ENVIRONMENT
// =====================================

const reflectionScene = new THREE.Scene();
reflectionScene.background = new THREE.Color(0x000000);

reflectionScene.add(new THREE.AmbientLight(0xffffff, 1.5));

const reflectionLight = new THREE.DirectionalLight(0xffffff, 3);
reflectionLight.position.set(5, 8, 5);
reflectionScene.add(reflectionLight);

// Environment holder controls rotation and offset
const environmentHolder = new THREE.Group();
reflectionScene.add(environmentHolder);

// Cube camera
const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512, {
  type: THREE.HalfFloatType,
  generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter
});

const cubeCamera = new THREE.CubeCamera(
  0.1,
  1000,
  cubeRenderTarget
);

reflectionScene.add(cubeCamera);

let importedPMREM = null;
let environmentLoaded = false;
let reflectionNeedsUpdate = false;

const status = document.getElementById("status");
const fileInput = document.getElementById("sceneFile");

// Sliders
const controls = {
  rotateX: document.getElementById("rotateX"),
  rotateY: document.getElementById("rotateY"),
  rotateZ: document.getElementById("rotateZ"),
  offsetX: document.getElementById("offsetX"),
  offsetY: document.getElementById("offsetY"),
  offsetZ: document.getElementById("offsetZ")
};

const displays = {
  rotateX: document.getElementById("rxValue"),
  rotateY: document.getElementById("ryValue"),
  rotateZ: document.getElementById("rzValue"),
  offsetX: document.getElementById("oxValue"),
  offsetY: document.getElementById("oyValue"),
  offsetZ: document.getElementById("ozValue")
};

// Apply slider values to environment
function applyEnvironmentControls() {
  const rx = Number(controls.rotateX.value);
  const ry = Number(controls.rotateY.value);
  const rz = Number(controls.rotateZ.value);

  const ox = Number(controls.offsetX.value);
  const oy = Number(controls.offsetY.value);
  const oz = Number(controls.offsetZ.value);

  environmentHolder.rotation.set(
    THREE.MathUtils.degToRad(rx),
    THREE.MathUtils.degToRad(ry),
    THREE.MathUtils.degToRad(rz)
  );

  environmentHolder.position.set(ox, oy, oz);

  displays.rotateX.textContent = rx + "°";
  displays.rotateY.textContent = ry + "°";
  displays.rotateZ.textContent = rz + "°";

  displays.offsetX.textContent = ox.toFixed(1);
  displays.offsetY.textContent = oy.toFixed(1);
  displays.offsetZ.textContent = oz.toFixed(1);

  if (environmentLoaded) {
    reflectionNeedsUpdate = true;
  }
}

// Slider events
Object.values(controls).forEach(slider => {
  slider.addEventListener("input", applyEnvironmentControls);
});

// Reset rotation
document.getElementById("resetRotation").addEventListener("click", () => {
  controls.rotateX.value = 0;
  controls.rotateY.value = 0;
  controls.rotateZ.value = 0;
  applyEnvironmentControls();
});

// Reset offset
document.getElementById("resetOffset").addEventListener("click", () => {
  controls.offsetX.value = 0;
  controls.offsetY.value = 0;
  controls.offsetZ.value = 0;
  applyEnvironmentControls();
});

// Import GLB
fileInput.addEventListener("change", (event) => {
  const file = event.target.files[0];

  if (!file) return;

  status.textContent = "Loading environment...";

  const reader = new FileReader();

  reader.onload = () => {
    loader.parse(
      reader.result,
      "",

      (gltf) => {
        environmentHolder.clear();

        const importedScene = gltf.scene;
        importedScene.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(importedScene);
        const centre = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDimension = Math.max(size.x, size.y, size.z);

        if (!Number.isFinite(maxDimension) || maxDimension === 0) {
          status.textContent = "Invalid GLB scene";
          return;
        }

        importedScene.position.sub(centre);
        importedScene.scale.setScalar(20 / maxDimension);

        environmentHolder.add(importedScene);

        // Reset controls
        Object.values(controls).forEach(slider => {
          slider.value = 0;
        });

        applyEnvironmentControls();

        environmentLoaded = true;
        reflectionNeedsUpdate = true;

        status.textContent = "Using: " + file.name;
        console.log("Reflection environment loaded!");
      },

      (error) => {
        console.error("Failed to load reflection scene:", error);
        status.textContent = "Failed to load GLB";
      }
    );
  };

  reader.onerror = () => {
    status.textContent = "Could not read file";
  };

  reader.readAsArrayBuffer(file);
});


// =====================================
// DRAG AND MOMENTUM
// =====================================

let dragging = false;

let previousX = 0;
let previousY = 0;

let velocityX = 0;
let velocityY = 0;

const FRICTION = 0.94;
const ROTATION_SENSITIVITY = 0.008;
const MAX_SPEED = 0.15;

const activePointers = new Map();

renderer.domElement.addEventListener("pointerdown", (event) => {
  activePointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (activePointers.size === 1) {
    dragging = true;
    previousX = event.clientX;
    previousY = event.clientY;
    velocityX = 0;
    velocityY = 0;
  }

  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener("pointermove", (event) => {
  if (!activePointers.has(event.pointerId)) return;

  const oldPointer = activePointers.get(event.pointerId);

  activePointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (activePointers.size === 2) {
    const other = [...activePointers.entries()]
      .find(([id]) => id !== event.pointerId)[1];

    const oldDistance = Math.hypot(
      oldPointer.x - other.x,
      oldPointer.y - other.y
    );

    const newDistance = Math.hypot(
      event.clientX - other.x,
      event.clientY - other.y
    );

    if (oldDistance > 0) {
      camera.position.z += (oldDistance - newDistance) * 0.025;
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z,
        4,
        25
      );
    }

    dragging = false;
    velocityX = 0;
    velocityY = 0;
    return;
  }

  if (activePointers.size === 1) {
    const dx = event.clientX - previousX;
    const dy = event.clientY - previousY;

    velocityX = THREE.MathUtils.clamp(
      dx * ROTATION_SENSITIVITY,
      -MAX_SPEED,
      MAX_SPEED
    );

    velocityY = THREE.MathUtils.clamp(
      dy * ROTATION_SENSITIVITY,
      -MAX_SPEED,
      MAX_SPEED
    );

    rotationGroup.rotation.y += velocityX;
    rotationGroup.rotation.x += velocityY;

    previousX = event.clientX;
    previousY = event.clientY;

    dragging = true;
  }
});

function removePointer(event) {
  activePointers.delete(event.pointerId);

  if (activePointers.size === 0) {
    dragging = false;
  } else if (activePointers.size === 1) {
    const remaining = [...activePointers.values()][0];

    previousX = remaining.x;
    previousY = remaining.y;

    dragging = true;
    velocityX = 0;
    velocityY = 0;
  }
}

renderer.domElement.addEventListener("pointerup", removePointer);
renderer.domElement.addEventListener("pointercancel", removePointer);

// Mouse wheel zoom
renderer.domElement.addEventListener("wheel", (event) => {
  event.preventDefault();

  camera.position.z += event.deltaY * 0.008;

  camera.position.z = THREE.MathUtils.clamp(
    camera.position.z,
    4,
    25
  );
}, { passive: false });


// =====================================
// ANIMATION
// =====================================

function animate() {
  requestAnimationFrame(animate);

  if (!dragging) {
    rotationGroup.rotation.y += velocityX;
    rotationGroup.rotation.x += velocityY;

    velocityX *= FRICTION;
    velocityY *= FRICTION;

    if (Math.abs(velocityX) < 0.0001) velocityX = 0;
    if (Math.abs(velocityY) < 0.0001) velocityY = 0;
  }

  // Re-capture environment only when its settings change
  if (reflectionNeedsUpdate && environmentLoaded) {
    reflectionNeedsUpdate = false;

    cubeCamera.update(renderer, reflectionScene);

    const newPMREM = pmrem.fromCubemap(
      cubeRenderTarget.texture
    );

    spoonMaterial.envMap = newPMREM.texture;
    spoonMaterial.needsUpdate = true;

    if (importedPMREM) {
      importedPMREM.dispose();
    }

    importedPMREM = newPMREM;
  }

  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>
</body>
</html>
